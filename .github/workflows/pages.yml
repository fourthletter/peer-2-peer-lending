name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Daily rebuild so the dashboard picks up new articles automatically.
    - cron: "30 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      # Rolling cache of per-year Event Registry pulls (saves API tokens on the
      # daily schedule). The current year is always re-fetched regardless, so
      # new articles still arrive every build; past years load from cache.
      - name: Restore per-year article cache
        uses: actions/cache@v4
        with:
          path: .viz_cache/years
          key: viz-years-${{ github.run_id }}
          restore-keys: |
            viz-years-

      - name: Build static site
        env:
          SITE_URL: https://morethancode.org
          SITE_DOMAIN: morethancode.org
          STATIC_BUILD: "1"
          VIZ_LOAD_ON_STARTUP: "0"
          WARM_VIZ_CACHE: "1"
          VIZ_CACHE_REFRESH: "0"
          STATIC_MIN_INCIDENTS: "50"
          EVENTREGISTRY_API_KEY: ${{ secrets.EVENTREGISTRY_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
        run: |
          chmod +x scripts/build_static_site.sh
          ./scripts/build_static_site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
