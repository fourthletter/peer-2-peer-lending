services:
  - type: web
    name: ai-labor-monitor
    runtime: python
    plan: starter
    repo: https://github.com/fourthletter/ai-labor-monitor
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 src.web:app
    healthCheckPath: /health
    domains:
      - morethancode.org
      - www.morethancode.org
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SITE_URL
        value: https://morethancode.org
      - key: DISCOVERY_SOURCE
        value: hybrid
      - key: DISCOVERY_SUPPLEMENT
        value: "1"
      - key: DISCOVERY_MAX_CANDIDATES
        value: "220"
      - key: RELEVANCE_THRESHOLD
        value: "32"
      - key: VIZ_LOAD_ON_STARTUP
        value: "0"
      - key: RANK_LLM
        value: "0"
      - key: SUMMARY_LLM
        value: "0"
      - key: VIZ_CACHE_DIR
        value: /var/data/viz_cache
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: EVENTREGISTRY_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
    disk:
      name: viz-cache
      mountPath: /var/data
      sizeGB: 1
